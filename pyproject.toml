[project]
name = "agent-smith"
version = "0.1.0"
requires-python = ">=3.10"
authors = [
    { name = "Rui Moura (rusilva-)" },
    { name = "Alexandre (acaldeir)" },
]
dependencies = [
    "mcp>=1.0.0",
    "openai>=2.44.0",
    "pydantic>=2.13.4",
]

[project.scripts]
sandbox = "sandbox.cli:main"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.2.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# without this pytest collects from the whole tree, picking up test
# files that live outside the project and never returning
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contract", "agent", "sandbox"]

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true
